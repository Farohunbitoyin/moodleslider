<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moodle Advanced Slider</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="slider-wrapper" id="sliderWrapper">
      <div class="top-bar">
        <div class="slide-counter" id="slideCounter">Slide 0 of 0</div>

        <div class="control-group">
          <button id="playPause" class="small-btn" title="Play or pause">
            Pause
          </button>
          <button id="fullscreenBtn" class="small-btn" title="Fullscreen">
            Fullscreen
          </button>
        </div>
      </div>

      <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div class="slider-container" id="sliderContainer">
        <div id="slider"></div>

        <button id="prev" class="nav-btn prev-btn" title="Previous slide">
          &#10094;
        </button>
        <button id="next" class="nav-btn next-btn" title="Next slide">
          &#10095;
        </button>
      </div>

      <div id="dots" class="dots"></div>
      <div id="thumbnails" class="thumbnails"></div>
    </div>
        <script src="script.js"></script>
  </body>
</html>
