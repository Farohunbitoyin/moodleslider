<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moodle Slider</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="slider-wrapper" id="sliderWrapper">

    <div class="top-bar">
        <div class="slide-counter" id="slideCounter">Slide 0 of 0</div>

        <button id="fullscreenBtn" class="fullscreen-btn" title="Fullscreen">
            ⛶ Fullscreen
        </button>
    </div>

    <div class="slider-container" id="sliderContainer">
        <div id="slider"></div>

        <button id="prev" class="nav-btn prev-btn" title="Previous slide">
            ❮
        </button>

        <button id="next" class="nav-btn next-btn" title="Next slide">
            ❯
        </button>
    </div>

    <div id="dots" class="dots"></div>
    <div id="thumbnails" class="thumbnails"></div>

</div>

<script src="script.js"></script>
</body>
</html>
